[package]
name = "veil-client"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
constcat = "0.6"
data-encoding = "2"
futures-util = "0.3"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.27", features = ["rustls-tls-native-roots"] }
url = "2"
veil-protocol = { path = "../veil-protocol" }
tungstenite = "0.27"
tokio-rustls = "0.26"
rustls = { version = "0.23", features = ["ring"] }
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json"] }
rkyv = { version = "0.8", features = ["std", "alloc"] }
zstd = "0.13"
x25519-dalek = { version = "2", features = ["getrandom"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
chacha20poly1305 = "0.10"
vodozemac = "0.9"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
serde_with = "3"
keyring = "2"
# ICE, DTLS and SRTP. §9: a 1:1 call needs no new cryptography, because this
# already encrypts end to end — what Veil supplies is authenticated signalling.
webrtc = "0.11"
# Devices and codec, both long-standing: cpal is what most Rust audio stands on,
# and libopus is what every WebRTC endpoint already speaks.
cpal = "0.15"
opus = "0.3"
# SQLCipher rather than plain SQLite: the search index lives inside the database,
# and §10.4 requires the index on disk to be encrypted rather than only its backup.
rusqlite = { version = "0.32", features = ["bundled-sqlcipher"] }
base64 = "0.2"

[dev-dependencies]
# The hostile-host test needs to *be* a server: it proxies a real one and lies
# about keys on the way past.
axum = { version = "0.8", features = ["ws"] }
# Self-signed certificates for the nested-TLS tests.
rcgen = "0.13"
