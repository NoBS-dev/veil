[package]
name = "veil-server"
version = "0.1.0"
edition = "2024"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json"] }
veil-protocol = { path = "../veil-protocol" }
rkyv = { version = "0.8", features = ["bytecheck", "alloc"] }
rkyv_derive = "0.8"
anyhow = "1"
data-encoding = "2"
axum = { version = "0.8", features = ["ws"] }
axum-server = { version = "0.7", features = ["tls-rustls-no-provider"] }
futures = "0.3"
itertools = "0.14"
serde_json = "1"
rand = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.27", features = ["rustls-tls-native-roots"] }
vodozemac = "0.9"

[dev-dependencies]
