[package]
name = "veil-protocol"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
chacha20poly1305 = "0.10"
data-encoding = "2"
hex = "0.4"
rkyv = { version = "0.8", features = ["alloc", "bytecheck"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_with = "3"
sha2 = "0.10"
thiserror = "2"
x25519-dalek = { version = "2", features = ["getrandom"] }
vodozemac = "0.9"
